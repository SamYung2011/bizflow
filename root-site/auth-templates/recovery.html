<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Honnmono password recovery</title>
  </head>
  <body style="margin:0;padding:24px;background:#F5F5F5;color:#2E2F30;font-family:Arial,'Helvetica Neue',sans-serif;">
    <main style="max-width:520px;margin:0 auto;padding:32px;background:#FFFFFF;border-radius:10px;">
      <p style="margin:0 0 24px;font-size:18px;font-weight:700;">Honnmono</p>
      <h1 style="margin:0 0 16px;font-size:24px;line-height:1.4;">密碼重置驗證碼</h1>
      <p style="margin:0 0 20px;font-size:15px;line-height:1.7;color:#5C5C5C;">
        輸入此驗證碼完成密碼重置，10 分鐘內有效；非本人操作請忽略。
      </p>
      <div style="margin:0 0 20px;padding:18px 12px;background:#F5F5F5;border-radius:10px;font-family:'Courier New',monospace;font-size:34px;font-weight:700;letter-spacing:.2em;line-height:1;text-align:center;">
        {{ .Token }}
      </div>
      <p style="margin:0;font-size:15px;line-height:1.7;color:#5C5C5C;">
        Enter this code to complete your password reset. It is valid for 10 minutes. If you did not request this, please ignore this email.
      </p>
    </main>
  </body>
</html>
